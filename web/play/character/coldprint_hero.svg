<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061020"/>
      <stop offset="0.5" stop-color="#0a1b30"/>
      <stop offset="1" stop-color="#0d2038"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.72" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#3f7ea6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7a8fc9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7a8fc9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#7fc4e8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fc4e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5a9fc4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132c48"/>
      <stop offset="1" stop-color="#0b1c30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9fb"/>
      <stop offset="1" stop-color="#4d8fb5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="softBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 极夜天空 -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- 极光 -->
  <rect width="1600" height="900" fill="url(#aurora)"/>

  <!-- 远景冰封城市剪影 -->
  <g fill="#0a1b30" opacity="0.92">
    <rect x="60"  y="470" width="80"  height="430"/>
    <rect x="150" y="400" width="60"  height="500"/>
    <rect x="225" y="500" width="95"  height="400"/>
    <rect x="340" y="340" width="52"  height="560"/>
    <rect x="408" y="460" width="85"  height="440"/>
    <rect x="1180" y="430" width="70" height="470"/>
    <rect x="1265" y="360" width="55" height="540"/>
    <rect x="1335" y="480" width="100" height="420"/>
    <rect x="1450" y="400" width="65" height="500"/>
  </g>
  <!-- 城市楼顶的冷光窗 -->
  <g fill="#7fc4e8" opacity="0.5">
    <rect x="82" y="520" width="9" height="14"/><rect x="104" y="590" width="9" height="14"/>
    <rect x="170" y="450" width="9" height="14"/><rect x="186" y="540" width="9" height="14"/>
    <rect x="362" y="400" width="8" height="12"/><rect x="375" y="480" width="8" height="12"/>
    <rect x="1202" y="490" width="9" height="14"/><rect x="1232" y="570" width="9" height="14"/>
    <rect x="1362" y="550" width="9" height="14"/><rect x="1472" y="470" width="9" height="14"/>
  </g>

  <!-- 冷光街灯 -->
  <circle cx="800" cy="470" r="260" fill="url(#lamp)" opacity="0.55"/>

  <!-- 落雪 -->
  <g fill="#d6f0ff" opacity="0.5">
    <circle cx="120" cy="80" r="2.4"/><circle cx="300" cy="140" r="1.8"/>
    <circle cx="460" cy="60" r="2.2"/><circle cx="620" cy="180" r="1.6"/>
    <circle cx="780" cy="100" r="2.6"/><circle cx="940" cy="150" r="1.8"/>
    <circle cx="1100" cy="70" r="2.2"/><circle cx="1260" cy="200" r="1.7"/>
    <circle cx="1420" cy="120" r="2.5"/><circle cx="1560" cy="220" r="1.9"/>
    <circle cx="220" cy="300" r="1.7"/><circle cx="540" cy="340" r="2.1"/>
    <circle cx="880" cy="280" r="1.6"/><circle cx="1180" cy="330" r="2.0"/>
    <circle cx="1340" cy="280" r="1.5"/><circle cx="1500" cy="360" r="1.8"/>
  </g>

  <!-- 侦探：半剪影 + 冷光勾边 -->
  <g transform="translate(800,560)">
    <!-- 风衣主体 -->
    <path d="M-110,-20 Q-82,-55 -42,-42 L-36,-190 Q0,-220 36,-190 L42,-42 Q82,-55 110,-20
             L138,170 Q66,196 0,196 Q-66,196 -138,170 Z" fill="url(#coat)"/>
    <!-- 风衣冷光勾边（右缘） -->
    <path d="M110,-20 L138,170 Q66,196 0,196" fill="none" stroke="url(#rim)" stroke-width="2.4" opacity="0.55"/>
    <!-- 头 -->
    <circle cx="0" cy="-235" r="40" fill="#0b1c30"/>
    <!-- 礼帽 -->
    <path d="M-54,-270 Q-54,-298 0,-298 Q54,-298 54,-270 Z" fill="#0b1c30"/>
    <rect x="-70" y="-274" width="140" height="12" rx="5" fill="#132c48"/>
    <rect x="-70" y="-274" width="140" height="12" rx="5" fill="none" stroke="url(#rim)" stroke-width="1.4" opacity="0.4"/>
    <!-- 帽檐冷光 -->
    <path d="M-70,-270 Q0,-254 70,-270" fill="none" stroke="#7fc4e8" stroke-width="1.6" opacity="0.4"/>
    <!-- 领带/围巾冷光 -->
    <path d="M-14,-180 L0,-120 L14,-180" fill="none" stroke="#7fc4e8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- 放大镜（冷光） -->
  <g transform="translate(905,470) rotate(18)">
    <circle cx="0" cy="0" r="86" fill="url(#glass)" stroke="#d6f0ff" stroke-width="7" opacity="0.95"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#5a9fc4" stroke-width="2.4" opacity="0.55"/>
    <rect x="70" y="70" width="86" height="20" rx="10" transform="rotate(45 70 70)" fill="#cfe9fb"/>
    <!-- 镜中线索：冰裂纹指纹 -->
    <g stroke="#eaf7ff" stroke-width="2.6" fill="none" opacity="0.9" filter="url(#soft)">
      <path d="M-36,-24 q22,-28 48,-8 q17,14 3,32 q-15,15 -32,3"/>
      <path d="M-22,-10 q15,-17 32,-5 q12,11 0,24 q-12,12 -27,3"/>
      <path d="M-10,2 q9,-11 22,-2"/>
      <!-- 冰裂纹 -->
      <path d="M-30,18 q6,10 16,4 M-8,-40 q8,-12 20,-6 M28,-30 q-2,14 -14,18"/>
    </g>
  </g>

  <!-- 冰面：底部冷光反射 -->
  <rect x="0" y="760" width="1600" height="140" fill="#08182a" opacity="0.85"/>
  <g stroke="#7fc4e8" stroke-width="2" opacity="0.16">
    <line x1="760" y1="760" x2="720" y2="900"/><line x1="800" y1="760" x2="800" y2="900"/>
    <line x1="840" y1="760" x2="880" y2="900"/>
  </g>
  <!-- 冰裂纹纹理 -->
  <g stroke="#9bd3f0" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M200,780 L240,800 L228,830 L280,850"/>
    <path d="M1200,790 L1240,805 L1230,840 L1290,855"/>
    <path d="M700,820 L740,830 L730,860"/>
    <path d="M1500,810 L1530,825 L1520,855"/>
  </g>

  <!-- 标题压暗（保证叠字可读，但比旧版更轻，让海报更通透） -->
  <rect width="1600" height="900" fill="#050a14" opacity="0.10"/>
</svg>
