<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#101728"/>
      <stop offset="1" stop-color="#1a2336"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb6e6" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- 夜空 -->
  <rect width="1600" height="560" fill="url(#sky)"/>

  <!-- 远处城市剪影 -->
  <g fill="#0c1320" opacity="0.9">
    <rect x="60"  y="300" width="70"  height="260"/>
    <rect x="150" y="250" width="55"  height="310"/>
    <rect x="225" y="330" width="90"  height="230"/>
    <rect x="340" y="210" width="48"  height="350"/>
    <rect x="408" y="290" width="80"  height="270"/>
    <rect x="1180" y="270" width="65" height="290"/>
    <rect x="1265" y="230" width="50" height="330"/>
    <rect x="1335" y="310" width="95" height="250"/>
    <rect x="1450" y="250" width="60" height="310"/>
  </g>
  <!-- 楼里零星窗光 -->
  <g fill="#ffd98a" opacity="0.55">
    <rect x="78" y="330" width="8" height="12"/><rect x="98" y="370" width="8" height="12"/>
    <rect x="168" y="290" width="8" height="12"/><rect x="182" y="340" width="8" height="12"/>
    <rect x="356" y="250" width="7" height="11"/><rect x="368" y="300" width="7" height="11"/>
    <rect x="1200" y="310" width="8" height="12"/><rect x="1230" y="360" width="8" height="12"/>
    <rect x="1355" y="350" width="8" height="12"/><rect x="1470" y="300" width="8" height="12"/>
  </g>

  <!-- 街灯光晕 -->
  <circle cx="800" cy="300" r="220" fill="url(#lamp)" opacity="0.5"/>

  <!-- 雨丝 -->
  <g stroke="#9fb8d6" stroke-width="1" opacity="0.20">
    <line x1="120" y1="0" x2="60" y2="160"/><line x1="300" y1="0" x2="240" y2="180"/>
    <line x1="500" y1="0" x2="450" y2="170"/><line x1="700" y1="0" x2="650" y2="190"/>
    <line x1="900" y1="0" x2="850" y2="170"/><line x1="1100" y1="0" x2="1050" y2="185"/>
    <line x1="1300" y1="0" x2="1250" y2="175"/><line x1="1480" y1="0" x2="1430" y2="165"/>
    <line x1="220" y1="120" x2="170" y2="280"/><line x1="620" y1="140" x2="570" y2="300"/>
    <line x1="1020" y1="130" x2="970" y2="290"/><line x1="1400" y1="120" x2="1350" y2="280"/>
  </g>

  <!-- 侦探剪影 -->
  <g fill="#05080f" transform="translate(800,360)">
    <!-- 风衣 -->
    <path d="M-95,-10 Q-70,-40 -35,-30 L-30,-150 Q0,-175 30,-150 L35,-30 Q70,-40 95,-10
             L120,120 Q60,140 0,140 Q-60,140 -120,120 Z"/>
    <!-- 头 -->
    <circle cx="0" cy="-185" r="34"/>
    <!-- 礼帽 -->
    <path d="M-46,-205 Q-46,-230 0,-230 Q46,-230 46,-205 Z"/>
    <rect x="-60" y="-208" width="120" height="10" rx="4"/>
  </g>
  <!-- 帽檐高光 -->
  <path d="M740,155 Q800,138 860,155" stroke="#2a3650" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- 放大镜 -->
  <g transform="translate(905,300) rotate(18)">
    <circle cx="0" cy="0" r="70" fill="url(#glass)" stroke="#cfe6ff" stroke-width="6" opacity="0.9"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#7fb6e6" stroke-width="2" opacity="0.5"/>
    <rect x="58" y="58" width="70" height="16" rx="8" transform="rotate(45 58 58)" fill="#cfe6ff"/>
    <!-- 镜中线索：一枚指纹 -->
    <g stroke="#eaf4ff" stroke-width="2.4" fill="none" opacity="0.85" filter="url(#soft)">
      <path d="M-30,-20 q18,-22 38,-6 q14,12 2,26 q-12,12 -26,2"/>
      <path d="M-18,-8 q12,-14 26,-4 q10,9 0,20 q-10,10 -22,2"/>
      <path d="M-8,2 q8,-9 18,-2"/>
    </g>
  </g>

  <!-- 地面反光 -->
  <rect x="0" y="500" width="1600" height="60" fill="#0a1018" opacity="0.7"/>
  <g stroke="#ffd98a" stroke-width="2" opacity="0.12">
    <line x1="780" y1="500" x2="760" y2="560"/><line x1="820" y1="500" x2="840" y2="560"/>
  </g>

  <!-- 标题压暗渐变，保证叠字可读 -->
  <rect width="1600" height="560" fill="#05080f" opacity="0.18"/>
</svg>
